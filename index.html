<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Due Management System</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f6f9;
            padding: 15px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }
        button:hover {
            background-color: #218838;
        }
        .search-box {
            margin-top: 25px;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        .total-box {
            margin-top: 15px;
            padding: 12px;
            background-color: #e9ecef;
            border-radius: 5px;
            font-weight: bold;
            text-align: right;
        }
        .delete-btn {
            background-color: #dc3545;
            padding: 5px 10px;
            width: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>DUE MANAGEMENT SYSTEM</h2>

    <!-- Entry Form -->
    <div class="form-group">
        <label>Name:</label>
        <input type="text" id="name" placeholder="Enter Name">
    </div>
    <div class="form-group">
        <label>Amount (Tk):</label>
        <input type="number" id="amount" placeholder="Enter Amount">
    </div>
    <div class="form-group">
        <label>Date:</label>
        <input type="date" id="date">
    </div>
    <button onclick="addEntry()">Add Entry</button>

    <!-- Search Section -->
    <div class="search-box">
        <label>Search by Name:</label>
        <input type="text" id="searchInput" onkeyup="renderData()" placeholder="Type to search...">
    </div>

    <!-- Data Table -->
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Tk</th>
                <th>Date</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="dataTable">
            <!-- Data will be inserted here dynamically -->
        </tbody>
    </table>

    <div class="total-box" id="totalDisplay">
        Total Receivable: Tk 0.00
    </div>
</div>

<script>
    // Load existing data from LocalStorage
    let records = JSON.parse(localStorage.getItem('dueRecords')) || [];

    // Set today's date in input field by default
    document.getElementById('date').valueAsDate = new Date();

    function addEntry() {
        let name = document.getElementById('name').value.trim();
        let amount = parseFloat(document.getElementById('amount').value);
        let date = document.getElementById('date').value;

        if (!name || isNaN(amount) || amount <= 0 || !date) {
            alert('Please enter valid Name, Amount, and Date!');
            return;
        }

        records.push({ name, amount, date });
        localStorage.setItem('dueRecords', JSON.stringify(records));

        // Clear input fields
        document.getElementById('name').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('date').valueAsDate = new Date();

        renderData();
    }

    function deleteEntry(index) {
        if (confirm("Are you sure you want to delete this entry?")) {
            records.splice(index, 1);
            localStorage.setItem('dueRecords', JSON.stringify(records));
            renderData();
        }
    }

    function renderData() {
        let tableBody = document.getElementById('dataTable');
        let search = document.getElementById('searchInput').value.toLowerCase();
        tableBody.innerHTML = '';

        let total = 0;

        records.forEach((item, index) => {
            if (item.name.toLowerCase().includes(search)) {
                total += item.amount;
                let row = `<tr>
                    <td>${item.name}</td>
                    <td>Tk ${item.amount.toFixed(2)}</td>
                    <td>${item.date}</td>
                    <td><button class="delete-btn" onclick="deleteEntry(${index})">Delete</button></td>
                </tr>`;
                tableBody.innerHTML += row;
            }
        });

        document.getElementById('totalDisplay').innerText = `Total Receivable: Tk ${total.toFixed(2)}`;
    }

    // Initial render
    renderData();
</script>

</body>
</html>
